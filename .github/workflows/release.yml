name: Release

# How a release happens:
#   1. You merge work to main with Conventional Commit messages (feat:, fix:, ...).
#   2. Release Please opens or updates a release pull request. It bumps the version
#      in package.json and writes CHANGELOG.md.
#   3. Release auto-merge checks the App's signed output after CI passes and merges
#      it. Release Please tags the commit and creates a GitHub release.
#   4. The publish job tests that exact commit, then STAGES the version on npm.
#      Nothing is installable yet.
#   5. The release note records the captured stage UUID. The human approves with 2FA:
#        bun run release:approve
#      In Pi: ! bun run release:approve. If UUID capture failed, list stages and pass one:
#        npm stage list om-pi-subagents
#        bun run release:approve <stage-uuid>
#      Direct approval uses the note's exact npm stage approve command, or the Staged tab.
#
# No npm token exists. npm trusts this workflow file through OIDC (trusted publishing).
# Publishing happens in this run, not in a tag-push workflow, because a tag made by
# Release Please does not start other workflows.
#
# Switched on by the repository variable RELEASE_PLEASE_ENABLED=true, after the one-time
# setup in docs/MAINTAINING.md (GitHub App secrets, npm trusted publisher, npm-publish environment).
on:
  push:
    branches:
      - main

# Each job asks for what it needs. The default for the workflow is read-only.
permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  HUSKY: "0"

jobs:
  release-please:
    name: Release pull request
    if: ${{ vars.RELEASE_PLEASE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      # The tagged commit. A release made on a later run can belong to an older push.
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # A GitHub App token, not GITHUB_TOKEN, so the release pull request starts the CI checks.
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Test and stage on npm
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The environment is limited to the main branch. npm trusts it by name.
    environment: npm-publish
    outputs:
      staged: ${{ steps.stage.outputs.staged }}
    permissions:
      contents: write # add the approval note to the GitHub release
      id-token: write # npm trusted publishing (OIDC)
      pull-requests: write # mention the maintainer on the release pull request
    env:
      # Host setup installs the pinned Pi CLI alongside its packages, as in CI.
      OMPS_PI_BIN: ${{ github.workspace }}/.pi-host/node_modules/.bin/pi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      # Trusted publishing and `npm stage` need npm 11.15 or later.
      - name: Update npm
        run: npm install -g npm@^11.15.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      # Stop early on a placeholder version, or a package.json that does not match the release.
      - name: Check the version
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "${PACKAGE_VERSION}" = "0.0.0" ]; then
            echo "package.json still has the placeholder version 0.0.0."
            exit 1
          fi
          if [ "${PACKAGE_VERSION}" != "${RELEASE_VERSION}" ]; then
            echo "package.json version ${PACKAGE_VERSION} does not match release ${RELEASE_VERSION}."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch pinned Pi packages and CLI
        run: bun run setup:host

      - name: Run the full gate
        run: bun run ci

      # No token: npm authenticates this workflow through OIDC. The version waits in the
      # Staged tab on npm until the maintainer approves it with 2FA.
      - name: Stage on npm
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          output="$(mktemp "${RUNNER_TEMP}/npm-stage.XXXXXX")"
          npm stage publish --access public 2>&1 | tee "$output"
          echo "staged=true" >> "$GITHUB_OUTPUT"
          uuid='[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'
          stage_id="$(grep -Eo "staged with id[[:space:]]+$uuid" "$output" | grep -Eo "$uuid" | tail -1 || true)"
          printf 'stage_id=%s\n' "$stage_id" >> "$GITHUB_OUTPUT"

      - name: Add the approval steps to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
          STAGE_ID: ${{ steps.stage.outputs.stage_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" --json body --jq .body > notes.md
          {
            echo
            echo "---"
            echo
            echo "**npm:** \`om-pi-subagents@${RELEASE_VERSION}\` is staged and not yet installable."
            echo "Human approval requires 2FA. Use the Staged tab at https://www.npmjs.com/package/om-pi-subagents."
            if [ -n "$STAGE_ID" ]; then
              echo "From the repository, run \`bun run release:approve\` (in Pi: \`! bun run release:approve\`)."
              echo "Direct approval: \`npm stage approve ${STAGE_ID}\`."
              echo "To try it first: \`npm stage download ${STAGE_ID}\` and install the tarball."
            else
              echo "The stage UUID was not captured. Run \`npm stage list om-pi-subagents\` and select this version."
              echo "Then run \`bun run release:approve <stage-uuid>\` with that explicit UUID."
            fi
          } >> notes.md
          gh release edit "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" --notes-file notes.md

      - name: Tell the maintainer to approve
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
          STAGE_ID: ${{ steps.stage.outputs.stage_id }}
          OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/pulls" --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            echo "No release pull request found; the GitHub release note has the approval steps."
            exit 0
          fi
          {
            echo "@$OWNER \`om-pi-subagents@$RELEASE_VERSION\` passed the full gate and is staged on npm."
            echo
            echo "Approve it with 2FA from the repository: \`bun run release:approve\` (in Pi: \`! bun run release:approve\`)."
            echo "Stage ID: \`${STAGE_ID:-not found; run npm stage list om-pi-subagents}\`"
          } > comment.md
          gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body-file comment.md

  report-failure:
    name: Report release failure
    needs: [release-please, publish]
    if: >-
      always() &&
      needs.release-please.outputs.release_created == 'true' &&
      needs.publish.outputs.staged != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Mark the GitHub release and tell the maintainer
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          {
            echo
            echo "---"
            echo
            echo "**npm:** This version was not published to npm. The release run failed before staging: $RUN_URL"
          } >> notes.md
          gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/pulls" --jq '.[0].number // empty')
          [ -n "$pr" ] || exit 0
          {
            echo "@$OWNER The Release run for \`$TAG_NAME\` failed before npm staged the version."
            echo "Read the failed job: $RUN_URL"
            echo "Fix the failed step, then rerun the Release workflow."
          } > comment.md
          gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body-file comment.md
