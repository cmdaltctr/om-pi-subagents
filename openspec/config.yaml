schema: spec-driven

context: |
  OMPS is a TypeScript Pi extension with source files in src/.
  YAML limits configure direct-child capacity per parent session and maximum depth from root zero.
  Exact omps approval permits nesting; fresh launches honour inherited branch depth ceilings.
  Preserve immediate-parent ownership, separate result delivery and subtree cleanup blocking.
  Approved todo children use the real mapped extension with local normal-mode tasks.
  Ambient child resources stay disabled and exact tool names remain enforced.
  Pi host packages are wildcard peers, borrowed from ignored .pi-host/ for development.
  Use Bun, Vitest, Oxlint and Oxfmt. Comments and documentation use plain British English.
  Public guides are docs/INSTALL.md, docs/USAGE.md and docs/UNINSTALL.md.
  Local reports and security evidence belong in ignored docs/local-docs/.
  Preserve ownership, readiness, saved-output and confirmed-cleanup boundaries.
  Do not install dependencies, create remotes or push without permission.
